
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b16">
<title>AM TV | تلویزیون شخصی من</title>
<style>
:root{--bg:#101b16;--panel:#1b2b22;--gold:#e8b85b;--cream:#f4edda;--muted:#a8b5a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:Tahoma,Arial,sans-serif}
header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #35483a}
.logo{width:48px;height:48px;border:2px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-weight:bold;font-size:13px}
header h1{font-size:22px;margin:0;color:var(--gold)}
header p{font-size:11px;color:var(--muted);margin:5px 0 0}
main{max-width:900px;margin:auto;padding:15px}
.panel{background:var(--panel);padding:14px;border-radius:14px;margin-bottom:14px}
.now{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dot{width:8px;height:8px;background:#e85d52;border-radius:50%}
#nowTitle{font-weight:bold;overflow-wrap:anywhere}
#screen{position:relative;width:100%;aspect-ratio:16/9;background:#050806;border:1px solid #52634f;border-radius:12px;overflow:hidden}
#player{position:absolute;inset:0;width:100%;height:100%;border:0}
.watermark{position:absolute;z-index:3;top:12px;left:12px;background:#101b16a8;border:1px solid #e8b85b88;border-radius:6px;padding:7px 9px;color:#f0c76d;font-size:12px;font-weight:bold;pointer-events:none;text-shadow:0 1px 3px #000}
.overlay{position:absolute;z-index:4;inset:auto 0 0;padding:38px 12px 12px;background:linear-gradient(transparent,#080d0beF);opacity:1;transition:opacity .25s}
#screen.clean .overlay{opacity:0}
#screen.clean:hover .overlay,#screen.clean:focus-within .overlay{opacity:1}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
button{background:#293c2f;color:var(--cream);border:1px solid #51644e;border-radius:9px;padding:10px 13px;font-size:14px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--gold);color:#152018;border-color:var(--gold);font-weight:bold}
button:disabled{opacity:.4}
#playBtn{min-width:94px}
.hint{font-size:11px;color:#d0d6c8;text-align:center;margin:9px 0 0}
input{width:100%;min-width:0;padding:12px;border-radius:9px;border:1px solid #435747;background:#101b16;color:white;font-size:14px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow button{white-space:nowrap}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.section-title h2{font-size:16px;margin:0}
#count{font-size:12px;color:var(--muted)}
#playlist{display:flex;flex-direction:column;gap:8px}
.track{display:flex;align-items:center;gap:9px;padding:10px;background:#142119;border:1px solid #35483a;border-radius:10px}
.track.active{border-color:var(--gold);background:#293527}
.tracknum{color:var(--gold);min-width:22px;text-align:center}
.trackname{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}
.trackbuttons{display:flex;gap:4px}
.trackbuttons button{padding:7px;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:13px}
.settings{display:flex;gap:8px;flex-wrap:wrap}
footer{text-align:center;color:#829184;font-size:11px;padding:18px}
@media(max-width:480px){
main{padding:10px}
.panel{padding:11px}
.controls{gap:6px}
.controls button{padding:9px 10px;font-size:12px}
.addrow{flex-wrap:wrap}
.addrow button{flex:1}
.track{gap:6px}
.trackbuttons button{padding:7px 6px}
}
</style>
</head>
<body>
<header>
  <div class="logo">AM<br>TV</div>
  <div>
    <h1>AM TV</h1>
    <p>تلویزیون شخصی تو · پخش شبانه‌روزی</p>
  </div>
</header>

<main>
  <section class="panel">
    <div class="now">
      <span class="dot"></span>
      <span id="nowTitle">به AM TV خوش آمدی</span>
    </div>

    <div id="screen">
      <div id="player"></div>
      <div class="watermark">◈ AM TV</div>
      <div class="overlay">
        <div class="controls">
          <button id="prevBtn" title="قبلی">⏮ قبلی</button>
          <button class="primary" id="playBtn">▶ پخش</button>
          <button id="nextBtn" title="بعدی">بعدی ⏭</button>
          <button id="fullBtn" title="تمام صفحه">⛶ تمام‌صفحه</button>
        </div>
      </div>
    </div>
    <p class="hint">AM TV ORIGINAL BROADCAST · برای نمایش کنترل‌ها روی تصویر بزن</p>
  </section>

  <section class="panel">
    <div class="section-title">
      <h2>افزودن برنامه</h2>
    </div>
    <input id="videoUrl" type="url" placeholder="لینک ویدیوی YouTube را وارد کن">
    <div class="addrow">
      <button class="primary" id="addBtn">＋ افزودن به لیست</button>
      <button id="pasteHelpBtn">راهنمای لینک</button>
    </div>
  </section>

  <section class="panel">
    <div class="section-title">
      <h2>📺 برنامه‌های AM TV</h2>
      <span id="count">۰ برنامه</span>
    </div>
    <div class="settings">
      <button id="autoBtn">▶ پخش خودکار: روشن</button>
      <button id="repeatBtn">🔁 تکرار لیست: روشن</button>
      <button id="clearBtn">پاک‌کردن لیست</button>
    </div>
    <div style="height:12px"></div>
    <div id="playlist"></div>
  </section>
</main>

<footer>AM TV · YOUR OWN LITTLE TELEVISION</footer>

<script>
const $ = id => document.getElementById(id);
const screen = $("screen");
const STORE = "amtv_playlist_v2";
let list = [];
let current = -1;
let player = null;
let ready = false;
let autoplay = true;
let repeat = true;
let isPlaying = false;

try {
  const saved = JSON.parse(localStorage.getItem(STORE) || "[]");
  if (Array.isArray(saved)) list = saved.filter(v =>
    v && /^[\w-]{11}$/.test(v.id) && typeof v.title === "string"
  );
} catch(e) {}

function save(){
  try { localStorage.setItem(STORE, JSON.stringify(list)); }
  catch(e) { alert("ذخیره‌سازی در مرورگر ممکن نیست."); }
}

function getId(url){
  try {
    const u = new URL(url);
    let id = "";
    if(u.hostname === "youtu.be") id = u.pathname.split("/").filter(Boolean)[0] || "";
    else if(u.hostname.endsWith("youtube.com") ||
            u.hostname.endsWith("youtube-nocookie.com")){
      if(u.pathname === "/watch") id = u.searchParams.get("v") || "";
      else if(/^\/(embed|shorts|live)\/[^/]+/.test(u.pathname))
        id = u.pathname.split("/")[2] || "";
    }
    return /^[\w-]{11}$/.test(id) ? id : null;
  } catch(e) { return null; }
}

function getTitle(url,id){
  try {
    const u = new URL(url);
    return u.searchParams.get("v") ? "برنامه YouTube" :
      "برنامه AM TV";
  } catch(e) { return "برنامه AM TV"; }
}

function loadAPI(){
  if(window.YT && window.YT.Player){ createPlayer(); return; }
  if(document.getElementById("yt-api")) return;
  const s = document.createElement("script");
  s.id = "yt-api";
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = createPlayer;

function createPlayer(){
  if(player || !window.YT || !YT.Player) return;
  player = new YT.Player("player", {
    width:"100%", height:"100%",
    videoId: list[current]?.id || "",
    playerVars:{
      autoplay:0,
      controls:1,
      playsinline:1,
      rel:0,
      enablejsapi:1
    },
    events:{
      onReady:()=>{
        ready=true;
        if(current >= 0) player.cueVideoById(list[current].id);
        updatePlayButton();
      },
      onStateChange:e=>{
        if(e.data === YT.PlayerState.PLAYING){
          isPlaying=true;
          updatePlayButton();
        } else if(e.data === YT.PlayerState.PAUSED ||
                  e.data === YT.PlayerState.CUED ||
                  e.data === YT.PlayerState.ENDED){
          isPlaying=false;
          updatePlayButton();
        }
        if(e.data === YT.PlayerState.ENDED && autoplay) nextVideo();
      },
      onError:e=>{
        $("nowTitle").textContent =
          "این ویدیو قابل پخش نیست؛ ممکن است محدودیت یوتیوب داشته باشد.";
      }
    }
  });
}

function updatePlayButton(){
  $("playBtn").textContent = isPlaying ? "⏸ توقف" : "▶ پخش";
}

function playIndex(i){
  if(!list.length) return;
  current = (i + list.length) % list.length;
  render();
  $("nowTitle").textContent = list[current].title;
  loadAPI();
  if(ready && player){
    player.loadVideoById(list[current].id);
  } else if(player && player.cueVideoById){
    player.cueVideoById(list[current].id);
  }
}

function nextVideo(){
  if(!list.length) return;
  if(current < list.length - 1) playIndex(current + 1);
  else if(repeat) playIndex(0);
  else {
    isPlaying=false;
    updatePlayButton();
  }
}

function previousVideo(){
  if(!list.length) return;
  playIndex(current <= 0 ? list.length - 1 : current - 1);
}

$("playBtn").onclick=()=>{
  if(current < 0){
    if(list.length) playIndex(0);
    else alert("اول یک لینک به پلی‌لیست اضافه کن.");
    return;
  }
  loadAPI();
  if(!ready || !player) return;
  if(isPlaying) player.pauseVideo();
  else player.playVideo();
};
$("nextBtn").onclick=nextVideo;
$("prevBtn").onclick=previousVideo;

$("fullBtn").onclick=async()=>{
  try {
    if(document.fullscreenElement) await document.exitFullscreen();
    else if(screen.requestFullscreen) await screen.requestFullscreen();
    else if(screen.webkitRequestFullscreen) screen.webkitRequestFullscreen();
    else alert("تمام‌صفحه در این مرورگر پشتیبانی نمی‌شود.");
  } catch(e) {
    alert("مرورگر اجازه تمام‌صفحه نداد. دوباره امتحان کن.");
  }
};
document.addEventListener("fullscreenchange",()=>{
  $("fullBtn").textContent = document.fullscreenElement ?
    "⤢ خروج از تمام‌صفحه" : "⛶ تمام‌صفحه";
});

$("addBtn").onclick=()=>{
  const url=$("videoUrl").value.trim();
  const id=getId(url);
  if(!id){
    alert("لینک معتبر ویدیوی YouTube وارد کن.");
    return;
  }
  if(list.some(v=>v.id===id)){
    alert("این ویدیو از قبل توی لیست هست.");
    return;
  }
  list.push({id,title:getTitle(url,id)});
  save();
  $("videoUrl").value="";
  render();
  if(current === -1) playIndex(0);
};
$("videoUrl").addEventListener("keydown",e=>{
  if(e.key==="Enter") $("addBtn").click();
});
$("pasteHelpBtn").onclick=()=>alert(
  "لینک ویدیو را از گزینه Share در YouTube کپی کن و اینجا قرار بده."
);

$("autoBtn").onclick=()=>{
  autoplay=!autoplay;
  $("autoBtn").textContent="▶ پخش خودکار: "+(autoplay?"روشن":"خاموش");
};
$("repeatBtn").onclick=()=>{
  repeat=!repeat;
  $("repeatBtn").textContent="🔁 تکرار لیست: "+(repeat?"روشن":"خاموش");
};
$("clearBtn").onclick=()=>{
  if(!confirm("همه برنامه‌های لیست پاک شوند؟")) return;
  list=[];
  current=-1;
  save();
  if(ready && player) player.stopVideo();
  isPlaying=false;
  $("nowTitle").textContent="به AM TV خوش آمدی";
  render();
};

function render(){
  $("count").textContent=list.length+" برنامه";
  const root=$("playlist");
  root.innerHTML="";
  if(!list.length){
    root.innerHTML='<div class="empty">هنوز برنامه‌ای نداری.<br>لینک اولین ویدیوت را بالا اضافه کن.</div>';
    return;
  }
  list.forEach((v,i)=>{
    const row=document.createElement("div");
    row.className="track"+(i===current?" active":"");
    const num=document.createElement("span");
    num.className="tracknum";
    num.textContent=String(i+1).padStart(2,"0");
    const name=document.createElement("div");
    name.className="trackname";
    name.textContent=v.title;
    const actions=document.createElement("div");
    actions.className="trackbuttons";
    const make=(label,fn)=>{
      const b=document.createElement("button");
      b.textContent=label;b.onclick=fn;return b;
    };
    actions.append(
      make("▶",()=>playIndex(i)),
      make("↑",()=>{
        if(i===0)return;
        [list[i-1],list[i]]=[list[i],list[i-1]];
        if(current===i)current=i-1;
        else if(current===i-1)current=i;
        save();render();
      }),
      make("↓",()=>{
        if(i===list.length-1)return;
        [list[i+1],list[i]]=[list[i],list[i+1]];
        if(current===i)current=i+1;
        else if(current===i+1)current=i;
        save();render();
      }),
      make("✕",()=>{
        list.splice(i,1);
        if(current===i){
          current=-1;
          isPlaying=false;
          if(list.length) playIndex(Math.min(i,list.length-1));
          else if(ready&&player) player.stopVideo();
        } else if(current>i) current--;
        save();render();
      })
    );
    row.append(num,name,actions);
    root.appendChild(row);
  });
}
render();
loadAPI();
</script>
</body>
</html>
