
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b16">
<title>AM TV — تلویزیون شخصی من</title>
<style>
:root {
  --bg: #101b16;
  --panel: #192820;
  --gold: #f4b942;
  --cream: #f5edda;
  --muted: #a7b6a6;
  --line: #3b5142;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--cream);
  font-family: Tahoma, Arial, sans-serif;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px;
  border-bottom: 2px solid var(--gold);
  background: #0b130f;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  display: grid;
  place-items: center;
  width: 54px;
  height: 46px;
  border: 2px solid var(--gold);
  color: var(--gold);
  font-size: 21px;
  font-weight: 900;
  letter-spacing: -2px;
  box-shadow: 3px 3px 0 #684c20;
}
h1 { margin: 0; font-size: 23px; letter-spacing: 2px; }
.subtitle { color: var(--muted); font-size: 11px; margin-top: 5px; }
.live {
  color: var(--gold);
  font-size: 11px;
  border: 1px solid var(--gold);
  padding: 7px 9px;
}
main { max-width: 1050px; margin: auto; padding: 16px; }
.section-title {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 1px;
  margin: 8px 0 12px;
}
.player-card {
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 10px;
}
.player-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.station { display: flex; align-items: center; gap: 9px; }
.mini-logo {
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 5px 7px;
  font-size: 12px;
  font-weight: bold;
}
#nowTitle { font-size: 13px; overflow-wrap: anywhere; }
#playerWrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}
#player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
#playerWrap:fullscreen {
  width: 100%;
  height: 100%;
  aspect-ratio: auto;
  background: #000;
}
#playerWrap:fullscreen #player {
  width: 100%;
  height: 100%;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}
button, input {
  font: inherit;
  border-radius: 0;
}
button {
  background: #263b2e;
  color: var(--cream);
  border: 1px solid #526c56;
  padding: 10px 13px;
  cursor: pointer;
}
button:hover { border-color: var(--gold); color: var(--gold); }
button.primary { background: var(--gold); color: #172016; font-weight: bold; }
button.active { border-color: var(--gold); color: var(--gold); }
.add-panel, .playlist-panel {
  margin-top: 18px;
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 14px;
}
.add-row { display: flex; gap: 8px; }
input {
  min-width: 0;
  flex: 1;
  background: #0d1711;
  border: 1px solid var(--line);
  color: var(--cream);
  padding: 12px;
}
input::placeholder { color: #8d9b8d; }
#playlist {
  list-style: none;
  padding: 0;
  margin: 0;
}
.track {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.track:last-child { border-bottom: 0; }
.track.selected { color: var(--gold); }
.track-main {
  flex: 1;
  min-width: 0;
  cursor: pointer;
  overflow-wrap: anywhere;
  font-size: 13px;
}
.track-number { color: var(--muted); font-size: 11px; }
.track-actions { display: flex; gap: 4px; }
.track-actions button { padding: 6px 8px; font-size: 12px; }
.options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  padding: 25px 10px;
}
@media (max-width: 480px) {
  header { padding: 13px 10px; }
  h1 { font-size: 19px; }
  main { padding: 10px; }
  .player-card { padding: 7px; }
  .track { flex-wrap: wrap; }
  .track-actions { margin-right: auto; }
  .add-row { flex-direction: column; }
  .add-row button { width: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">AM</div>
    <div>
      <h1>AM TV</h1>
      <div class="subtitle">YOUR PERSONAL TELEVISION</div>
    </div>
  </div>
  <div class="live">● ON AIR</div>
</header>

<main>
  <div class="section-title">NOW PLAYING / پخش زنده</div>
  <section class="player-card">
    <div class="player-top">
      <div class="station">
        <div class="mini-logo">AM TV</div>
        <div id="nowTitle">هنوز برنامه‌ای انتخاب نشده</div>
      </div>
      <span style="color:var(--gold);font-size:11px">CH 01</span>
    </div>

    <div id="playerWrap">
      <iframe id="player"
        src="about:blank"
        title="AM TV Video Player"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>

    <div class="controls">
      <button id="prevBtn">⏮ قبلی</button>
      <button id="playBtn" class="primary">▶ پخش</button>
      <button id="nextBtn">بعدی ⏭</button>
      <button id="fullBtn">⛶ تمام‌صفحه</button>
    </div>
    <div class="options">
      <button id="repeatBtn">🔁 تکرار: خاموش</button>
      <button id="autoBtn" class="active">▶ پخش خودکار: روشن</button>
    </div>
  </section>

  <section class="add-panel">
    <div class="section-title">ADD TO YOUR CHANNEL / افزودن برنامه</div>
    <div class="add-row">
      <input id="videoUrl" type="url"
        placeholder="لینک ویدیوی یوتیوب را وارد کن...">
      <button id="addBtn" class="primary">＋ افزودن</button>
    </div>
    <div style="color:var(--muted);font-size:11px;margin-top:9px">
      لینک ویدیوهای عمومی یوتیوب را وارد کن.
    </div>
  </section>

  <section class="playlist-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
      <div class="section-title" style="margin:0">MY PLAYLIST / لیست برنامه‌ها</div>
      <span id="count" style="color:var(--muted);font-size:11px">۰ برنامه</span>
    </div>
    <ul id="playlist"></ul>
    <div id="empty" style="color:var(--muted);font-size:13px;padding:15px 0">
      هنوز برنامه‌ای اضافه نشده.
    </div>
    <div class="options">
      <button id="clearBtn">حذف همه برنامه‌ها</button>
    </div>
  </section>
</main>

<footer>AM TV © YOUR OWN LITTLE TV STATION</footer>

<script>
const $ = id => document.getElementById(id);
const STORAGE = 'amtv_playlist_v2';
const SETTINGS = 'amtv_settings_v2';

let tracks = [];
let current = -1;
let repeat = false;
let autoplay = true;
let playerReady = false;
let player = null;

try {
  tracks = JSON.parse(localStorage.getItem(STORAGE) || '[]');
  if (!Array.isArray(tracks)) tracks = [];
} catch (_) { tracks = []; }

try {
  const s = JSON.parse(localStorage.getItem(SETTINGS) || '{}');
  repeat = !!s.repeat;
  autoplay = s.autoplay !== false;
} catch (_) {}

function save() {
  localStorage.setItem(STORAGE, JSON.stringify(tracks));
  localStorage.setItem(SETTINGS, JSON.stringify({repeat, autoplay}));
}

function getId(raw) {
  try {
    const u = new URL(raw.trim());
    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    if (host === 'youtu.be') return u.pathname.split('/').filter(Boolean)[0] || null;
    if (['youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com'].includes(host)) {
      if (u.pathname === '/watch') return u.searchParams.get('v');
      const m = u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);
      return m ? m[1] : null;
    }
  } catch (_) {}
  return null;
}

function render() {
  $('playlist').innerHTML = '';
  $('count').textContent = tracks.length + ' برنامه';
  $('empty').style.display = tracks.length ? 'none' : 'block';

  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = 'track' + (i === current ? ' selected' : '');

    const num = document.createElement('span');
    num.className = 'track-number';
    num.textContent = String(i + 1).padStart(2, '0');

    const name = document.createElement('div');
    name.className = 'track-main';
    name.textContent = t.title || ('YouTube ' + t.id);
    name.title = 'برای پخش انتخاب کن';
    name.onclick = () => playAt(i);

    const actions = document.createElement('div');
    actions.className = 'track-actions';

    function action(label, title, fn) {
      const b = document.createElement('button');
      b.textContent = label;
      b.title = title;
      b.onclick = fn;
      actions.appendChild(b);
    }
    action('↑', 'انتقال به بالا', () => move(i, -1));
    action('↓', 'انتقال به پایین', () => move(i, 1));
    action('×', 'حذف برنامه', () => remove(i));

    li.append(num, name, actions);
    $('playlist').appendChild(li);
  });

  $('repeatBtn').textContent = '🔁 تکرار: ' + (repeat ? 'روشن' : 'خاموش');
  $('autoBtn').textContent = '▶ پخش خودکار: ' + (autoplay ? 'روشن' : 'خاموش');
  $('autoBtn').classList.toggle('active', autoplay);
}

function addTrack() {
  const url = $('videoUrl').value.trim();
  const id = getId(url);
  if (!id || !/^[\w-]{11}$/.test(id)) {
    alert('لینک یوتیوب معتبر نیست. دوباره بررسی کن.');
    return;
  }
  if (tracks.some(t => t.id === id)) {
    alert('این ویدیو قبلاً در پلی‌لیست هست.');
    return;
  }
  tracks.push({id, title: 'YouTube · ' + id});
  save();
  render();
  $('videoUrl').value = '';
  if (current === -1) playAt(0);
}

function playAt(index) {
  if (!tracks.length) return;
  current = (index + tracks.length) % tracks.length;
  const t = tracks[current];
  $('nowTitle').textContent = t.title || 'AM TV';
  $('player').src = 'https://www.youtube-nocookie.com/embed/' +
    encodeURIComponent(t.id) +
    '?autoplay=1&enablejsapi=1&playsinline=1&rel=0';
  render();
}

function next() {
  if (!tracks.length) return;
  if (current < 0) return playAt(0);
  if (current + 1 < tracks.length) return playAt(current + 1);
  if (repeat) return playAt(0);
  if (autoplay) {
    $('nowTitle').textContent = 'پایان پلی‌لیست';
  }
}

function previous() {
  if (!tracks.length) return;
  playAt(current <= 0 ? tracks.length - 1 : current - 1);
}

function move(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= tracks.length) return;
  [tracks[index], tracks[target]] = [tracks[target], tracks[index]];
  if (current === index) current = target;
  else if (current === target) current = index;
  save();
  render();
}

function remove(index) {
  tracks.splice(index, 1);
  if (!tracks.length) {
    current = -1;
    $('player').src = 'about:blank';
    $('nowTitle').textContent = 'هنوز برنامه‌ای انتخاب نشده';
  } else if (current === index) {
    current = Math.min(index, tracks.length - 1);
    playAt(current);
  } else if (current > index) {
    current--;
  }
  save();
  render();
}

$('addBtn').onclick = addTrack;
$('videoUrl').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTrack();
});
$('prevBtn').onclick = previous;
$('nextBtn').onclick = next;
$('playBtn').onclick = () => {
  if (current < 0 && tracks.length) return playAt(0);
  try {
    if (player && playerReady) player.playVideo();
    else if (current >= 0) playAt(current);
  } catch (_) {
    if (current >= 0) playAt(current);
  }
};
$('repeatBtn').onclick = () => {
  repeat = !repeat; save(); render();
};
$('autoBtn').onclick = () => {
  autoplay = !autoplay; save(); render();
};
$('clearBtn').onclick = () => {
  if (!tracks.length || !confirm('همه برنامه‌ها حذف شوند؟')) return;
  tracks = [];
  current = -1;
  $('player').src = 'about:blank';
  $('nowTitle').textContent = 'هنوز برنامه‌ای انتخاب نشده';
  save(); render();
};
$('fullBtn').onclick = async () => {
  const frame = $('player');
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if (frame.requestFullscreen) {
      await frame.requestFullscreen();
    } else if (frame.webkitRequestFullscreen) {
      frame.webkitRequestFullscreen();
    } else {
      alert('این مرورگر تمام‌صفحه را برای این پلیر پشتیبانی نمی‌کند. از دکمه تمام‌صفحه خود ویدیو استفاده کن.');
    }
  } catch (_) {
    alert('تمام‌صفحه توسط مرورگر یا پلیر محدود شده است. دکمه تمام‌صفحه داخل ویدیو را امتحان کن.');
  }
};

render();
if (tracks.length) {
  current = 0;
  $('nowTitle').textContent = tracks[0].title || 'AM TV';
  // برای جلوگیری از پخش ناخواسته هنگام بازکردن سایت،
  // ویدیو پس از انتخاب کاربر اجرا می‌شود.
}
</script>
</body>
</html>
